<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSU Security Management System</title>
    
    <!-- External Resources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="Style/splash.css">
</head>
<body>
    <!-- Animated Background -->
    <ul class="bg-bubbles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- Skip Button -->
    <button class="skip-btn" id="skipBtn" aria-label="Skip splash screen">
        <i class="fas fa-forward"></i> Skip
    </button>

    <!-- Main Content -->
    <main class="splash-container" role="main">
        <div class="logo-container">
            <div class="logo" aria-hidden="true">
                <img src="Assets/rsulogo.png" alt="RSU Logo" onerror="this.style.display='none'">
            </div>
            <h1>RSU Security</h1>
            <div class="subtitle">RFID Access Control System</div>
        </div>

        <!-- Progress Section -->
        <section class="progress-section" aria-label="System loading progress">
            <div class="loading-bar">
                <div class="loading-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                <div class="loading-percentage" id="loadingPercentage">0%</div>
            </div>
            <div class="status-text" id="statusText" aria-live="polite">Initializing System...</div>
        </section>

        <!-- Features Grid -->
        <section class="features" aria-label="System features">
            <div class="feature">
                <i class="fas fa-id-card" aria-hidden="true"></i>
                <span>RFID Access</span>
            </div>
            <div class="feature">
                <i class="fas fa-shield-alt" aria-hidden="true"></i>
                <span>Security</span>
            </div>
            <div class="feature">
                <i class="fas fa-chart-line" aria-hidden="true"></i>
                <span>Analytics</span>
            </div>
            <div class="feature">
                <i class="fas fa-database" aria-hidden="true"></i>
                <span>Database</span>
            </div>
        </section>

        <!-- System Status -->
        <section class="system-info" aria-label="System status information">
            <div class="status-item">
                <span>Database Connection:</span>
                <span>
                    <span class="status-indicator" id="dbIndicator" aria-hidden="true"></span>
                    <span id="dbStatus">Checking...</span>
                </span>
            </div>
            <div class="status-item">
                <span>RFID Listener:</span>
                <span>
                    <span class="status-indicator" id="rfidIndicator" aria-hidden="true"></span>
                    <span id="rfidStatus">Checking...</span>
                </span>
            </div>
            <div class="status-item">
                <span>System API:</span>
                <span>
                    <span class="status-indicator" id="apiIndicator" aria-hidden="true"></span>
                    <span id="apiStatus">Checking...</span>
                </span>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="Srcipt/splash.js"></script>
</body>
</html>
