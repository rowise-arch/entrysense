<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-cog"></i> System Settings</h2>
            <span class="close-modal">&times;</span>
        </div>
        
        <div class="modal-body">
            <form id="settingsForm">
                <div class="settings-group">
                    <h3><i class="fas fa-user-clock"></i> Session Settings</h3>
                    
                    <div class="form-group">
                        <label for="auto_logout">Auto Logout (minutes)</label>
                        <input type="number" id="auto_logout" name="auto_logout" min="5" max="120" value="30">
                        <small>Automatically logout after inactivity</small>
                    </div>
                </div>

                <div class="settings-group">
                    <h3><i class="fas fa-palette"></i> Appearance</h3>
                    
                    <div class="form-group">
                        <label for="theme">Theme</label>
                        <select id="theme" name="theme">
                            <option value="light">Light</option>
                            <option value="dark">Dark</option>
                            <option value="auto">Auto (System)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="language">Language</label>
                        <select id="language" name="language">
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                        </select>
                    </div>
                </div>

                <div class="settings-group">
                    <h3><i class="fas fa-bell"></i> Notifications & Sounds</h3>
                    
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="notifications" name="notifications" value="1" checked>
                            Enable Desktop Notifications
                        </label>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="scan_sound" name="scan_sound" value="1" checked>
                            Play Sound on RFID Scan
                        </label>
                    </div>
                </div>

                <div class="settings-group">
                    <h3><i class="fas fa-globe"></i> Regional</h3>
                    
                    <div class="form-group">
                        <label for="timezone">Timezone</label>
                        <select id="timezone" name="timezone">
                            <option value="Asia/Manila">Manila (UTC+8)</option>
                            <option value="America/New_York">New York (UTC-5)</option>
                            <option value="Europe/London">London (UTC+0)</option>
                            <option value="Asia/Tokyo">Tokyo (UTC+9)</option>
                            <option value="Australia/Sydney">Sydney (UTC+10)</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelSettings">Cancel</button>
                    <button type="submit" class="btn-primary">Save Settings</button>
                </div>
            </form>
        </div>
    </div>
</div>
