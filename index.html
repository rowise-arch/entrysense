<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSU Security Management System</title>
    
    <!-- External Resources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="Style/splash.css"> <!-- Using login.css -->
</head>
<body>
    <!-- Animated Background -->
    <ul class="bg-bubbles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- Main Container (using login.php structure) -->
    <div class="login-container glass-card">
        <div class="login-header">
            <div class="logo-container">
                <div class="logo">
                    <img src="Assets/rsulogo.png" alt="RSU Logo" onerror="this.style.display='none'">
                </div>
                <h1>RSU Security</h1>
                <p class="subtitle">System Initialization</p>
            </div>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="loading-bar">
                <div class="loading-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                <div class="loading-percentage" id="loadingPercentage">0%</div>
            </div>
            <div class="status-text" id="statusText">Initializing System...</div>
        </div>

        <!-- Features Grid -->
        <div class="features-grid">
            <div class="feature-item">
                <i class="fas fa-id-card"></i>
                <span>RFID Access</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-shield-alt"></i>
                <span>Security</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-chart-line"></i>
                <span>Analytics</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-database"></i>
                <span>Database</span>
            </div>
        </div>

        <!-- System Status -->
        <div class="system-status">
            <div class="status-row">
                <span>Database Connection:</span>
                <span class="status-info">
                    <span class="status-indicator" id="dbIndicator"></span>
                    <span id="dbStatus">Checking...</span>
                </span>
            </div>
            <div class="status-row">
                <span>RFID Listener:</span>
                <span class="status-info">
                    <span class="status-indicator" id="rfidIndicator"></span>
                    <span id="rfidStatus">Checking...</span>
                </span>
            </div>
            <div class="status-row">
                <span>System API:</span>
                <span class="status-info">
                    <span class="status-indicator" id="apiIndicator"></span>
                    <span id="apiStatus">Checking...</span>
                </span>
            </div>
        </div>

        <!-- Skip Button -->
        <button class="skip-btn" id="skipBtn">
            <i class="fas fa-forward"></i> Skip Initialization
        </button>
    </div>

    <!-- JavaScript -->
    <script src="Srcipt/splash.js"></script>
</body>
</html>
